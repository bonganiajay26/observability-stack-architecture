# kube-prometheus-stack Helm values
# Install: helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring -f prometheus-values.yaml

nameOverride: monitoring

# ── Prometheus ──
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "45GB"
    scrapeInterval: 15s
    evaluationInterval: 15s
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
    # Scrape all pods with prometheus annotations
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: python-devops-app
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

# ── Grafana ──
grafana:
  enabled: true
  adminPassword: "changeme-use-vault-in-prod"
  persistence:
    enabled: true
    size: 10Gi
  grafana.ini:
    server:
      root_url: https://grafana.yourdomain.com
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://monitoring-kube-prometheus-prometheus:9090
          isDefault: true
          access: proxy
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
        - name: Tempo
          type: tempo
          url: http://tempo:3100
          access: proxy
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              filterByTraceID: true
              filterBySpanID: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboards

# ── AlertManager ──
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "YOUR_SLACK_WEBHOOK_URL"
    route:
      group_by: [alertname, cluster, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: slack-default
      routes:
        - matchers:
            - severity=critical
          receiver: pagerduty-critical
          continue: true
        - matchers:
            - severity=warning
          receiver: slack-warnings
    receivers:
      - name: slack-default
        slack_configs:
          - channel: "#devops-alerts"
            title: "{{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
            send_resolved: true
      - name: slack-warnings
        slack_configs:
          - channel: "#devops-warnings"
            title: "⚠️ {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
            send_resolved: true
      - name: pagerduty-critical
        pagerduty_configs:
          - routing_key: "YOUR_PAGERDUTY_ROUTING_KEY"
            severity: critical
            description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
    inhibit_rules:
      - source_matchers:
          - severity=critical
        target_matchers:
          - severity=warning
        equal: [alertname, cluster, namespace]

# ── Node Exporter ──
nodeExporter:
  enabled: true

# ── kube-state-metrics ──
kubeStateMetrics:
  enabled: true

# ── Prometheus Operator ──
prometheusOperator:
  enabled: true
