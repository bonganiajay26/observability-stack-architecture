apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  red-dashboard.json: |
    # Contents of grafana/dashboards/red-dashboard.json go here
    # kubectl create configmap grafana-dashboards --from-file=grafana/dashboards/ -n monitoring
---
# ServiceMonitor — tells Prometheus to scrape the Flask app
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-devops-app-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - production
  selector:
    matchLabels:
      app: python-devops-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
